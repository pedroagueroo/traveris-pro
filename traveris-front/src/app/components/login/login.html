<div class="login-page">
  <!-- Left Panel: Branding -->
  <div class="login-branding">
    <div class="branding-content">
      <div class="branding-icon animate-scale-in">
        <i class="bi bi-airplane-engines-fill"></i>
      </div>
      <h1 class="branding-title animate-slide-up">TRAVERIS PRO</h1>
      <p class="branding-subtitle animate-slide-up">Sistema Integral de Gestión Turística</p>

      <div class="branding-features animate-fade-in">
        <div class="feature-item">
          <i class="bi bi-people-fill"></i>
          <span>Gestión de Clientes</span>
        </div>
        <div class="feature-item">
          <i class="bi bi-calendar-check-fill"></i>
          <span>Control de Reservas</span>
        </div>
        <div class="feature-item">
          <i class="bi bi-cash-coin"></i>
          <span>Caja Contable</span>
        </div>
        <div class="feature-item">
          <i class="bi bi-graph-up-arrow"></i>
          <span>Reportes y Alertas</span>
        </div>
      </div>
    </div>

    <div class="branding-footer">
      <span>Potenciado para agencias de viaje</span>
    </div>
  </div>

  <!-- Right Panel: Form -->
  <div class="login-form-panel">
    <div class="login-form-container animate-scale-in">
      <div class="form-header">
        <div class="form-logo d-lg-none">
          <i class="bi bi-airplane-engines-fill"></i>
        </div>
        <h2>Bienvenido</h2>
        <p>Ingresá tus credenciales para acceder al panel</p>
      </div>

      <!-- Error Message -->
      <div class="login-error" *ngIf="errorLogin">
        <i class="bi bi-exclamation-triangle-fill"></i>
        <span>{{ errorMessage }}</span>
      </div>

      <form (ngSubmit)="onLogin()">
        <div class="form-group">
          <label for="user">
            <i class="bi bi-person-fill"></i>
            Usuario
          </label>
          <input 
            type="text" 
            id="user" 
            name="user"
            [(ngModel)]="credenciales.user" 
            placeholder="Ingresá tu nombre de usuario"
            [class.input-error]="errorLogin && !credenciales.user"
            autocomplete="username"
            required
          >
        </div>

        <div class="form-group">
          <label for="pass">
            <i class="bi bi-lock-fill"></i>
            Contraseña
          </label>
          <input 
            type="password" 
            id="pass" 
            name="pass"
            [(ngModel)]="credenciales.pass" 
            placeholder="Ingresá tu contraseña"
            [class.input-error]="errorLogin && !credenciales.pass"
            autocomplete="current-password"
            required
          >
        </div>

        <button type="submit" class="login-btn" [disabled]="loading">
          <span *ngIf="!loading">
            <i class="bi bi-box-arrow-in-right me-2"></i>
            INGRESAR AL PANEL
          </span>
          <span *ngIf="loading" class="loading-state">
            <span class="spinner"></span>
            Ingresando...
          </span>
        </button>
      </form>

      <div class="form-footer">
        <p>¿Olvidaste tu acceso? Contactá al Administrador.</p>
      </div>
    </div>
  </div>
</div>
