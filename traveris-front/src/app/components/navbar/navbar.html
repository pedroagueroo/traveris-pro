<!-- ==================== SIDEBAR ==================== -->
<aside class="sidebar" [class.collapsed]="sidebarCollapsed" [class.mobile-open]="mobileMenuOpen">

  <!-- Logo -->
  <div class="sidebar-header">
    <a routerLink="/dashboard" class="sidebar-brand" (click)="closeMobileMenu()">
      <div class="brand-icon">
        <i class="bi bi-airplane-engines-fill"></i>
      </div>
      <span class="brand-text" *ngIf="!sidebarCollapsed">TRAVERIS PRO</span>
    </a>
    <button class="sidebar-toggle d-none d-lg-flex" (click)="toggleSidebar()">
      <i class="bi" [class.bi-chevron-left]="!sidebarCollapsed" [class.bi-chevron-right]="sidebarCollapsed"></i>
    </button>
  </div>

  <!-- Navigation Links -->
  <nav class="sidebar-nav">
    <div class="nav-section">
      <span class="nav-section-label" *ngIf="!sidebarCollapsed">MENÚ PRINCIPAL</span>

      <a class="nav-item" routerLink="/dashboard" routerLinkActive="active" 
         [routerLinkActiveOptions]="{exact: true}" (click)="closeMobileMenu()" title="Dashboard">
        <i class="bi bi-grid-1x2-fill"></i>
        <span *ngIf="!sidebarCollapsed">Dashboard</span>
      </a>

      <a class="nav-item" routerLink="/clientes" routerLinkActive="active" (click)="closeMobileMenu()" title="Clientes">
        <i class="bi bi-people-fill"></i>
        <span *ngIf="!sidebarCollapsed">Clientes</span>
      </a>

      <a class="nav-item" routerLink="/reservas" routerLinkActive="active" (click)="closeMobileMenu()" title="Reservas">
        <i class="bi bi-calendar-check-fill"></i>
        <span *ngIf="!sidebarCollapsed">Reservas</span>
      </a>

      <a class="nav-item" routerLink="/caja" routerLinkActive="active" (click)="closeMobileMenu()" title="Caja">
        <i class="bi bi-cash-coin"></i>
        <span *ngIf="!sidebarCollapsed">Caja Contable</span>
      </a>
    </div>

    <div class="nav-section" *ngIf="!sidebarCollapsed">
      <span class="nav-section-label">ACCIONES RÁPIDAS</span>

      <a class="nav-item" routerLink="/clientes/nuevo" routerLinkActive="active" (click)="closeMobileMenu()">
        <i class="bi bi-person-plus-fill"></i>
        <span>Nuevo Cliente</span>
      </a>

      <a class="nav-item" routerLink="/reservas/nuevo" routerLinkActive="active" (click)="closeMobileMenu()">
        <i class="bi bi-plus-circle-fill"></i>
        <span>Nueva Reserva</span>
      </a>

      <a class="nav-item" routerLink="/clientes/importar" routerLinkActive="active" (click)="closeMobileMenu()">
        <i class="bi bi-cloud-upload-fill"></i>
        <span>Importar Excel</span>
      </a>
    </div>
  </nav>

  <!-- Sidebar Footer -->
  <div class="sidebar-footer">
    <!-- Theme Toggle -->
    <button class="theme-toggle" (click)="theme.toggleTheme()" [title]="theme.isDark() ? 'Modo claro' : 'Modo oscuro'">
      <i class="bi" [class.bi-sun-fill]="theme.isDark()" [class.bi-moon-fill]="!theme.isDark()"></i>
      <span *ngIf="!sidebarCollapsed">{{ theme.isDark() ? 'Modo Claro' : 'Modo Oscuro' }}</span>
    </button>

    <!-- Agency Info -->
    <div class="agency-info" *ngIf="!sidebarCollapsed">
      <div class="agency-badge">
        <i class="bi bi-building"></i>
      </div>
      <div class="agency-details">
        <span class="agency-label">OPERANDO COMO</span>
        <span class="agency-name">{{ auth.getNombreEmpresa() }}</span>
      </div>
    </div>

    <!-- Logout -->
    <button class="logout-btn" (click)="salir()" title="Cerrar Sesión">
      <i class="bi bi-box-arrow-left"></i>
      <span *ngIf="!sidebarCollapsed">Cerrar Sesión</span>
    </button>
  </div>
</aside>

<!-- ==================== MOBILE OVERLAY ==================== -->
<div class="sidebar-overlay" *ngIf="mobileMenuOpen" (click)="closeMobileMenu()"></div>

<!-- ==================== TOP BAR (Mobile + Desktop) ==================== -->
<header class="topbar" [class.sidebar-collapsed]="sidebarCollapsed">
  <!-- Mobile hamburger -->
  <button class="topbar-hamburger d-lg-none" (click)="toggleMobileMenu()">
    <i class="bi bi-list"></i>
  </button>

  <!-- Search -->
  <div class="topbar-search">
    <div class="search-input-wrapper">
      <i class="bi bi-search"></i>
      <input 
        type="text" 
        placeholder="Buscar reserva/s de cliente por nombre o DNI..." 
        [(ngModel)]="terminoBusqueda"
        (input)="buscarClientes()"
        autocomplete="off"
      >
    </div>
    <div class="search-results" *ngIf="resultados.length > 0">
      <a *ngFor="let c of resultados" class="search-result-item"
         [routerLink]="['/reservas-cliente', c.id]"
         (click)="limpiarBusqueda()">
        <span class="result-name">{{ c.nombre_completo }}</span>
        <span class="result-badge">{{ c.dni_pasaporte }}</span>
      </a>
    </div>
  </div>

  <!-- Right side -->
  <div class="topbar-right">
    <span class="topbar-agency d-none d-md-block">{{ auth.getNombreEmpresa() }}</span>
  </div>
</header>
